[project]
name = "pykmc"
version = "0.0.1"
authors = [
  { name="Hugo Moison" },
]
description = "test kmc and python"
readme = "README.md"
requires-python = "<3.13,>=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = ["ase>=3.24.0", "executorlib==0.0.8", "lammps>=2024.8.29", "mpi4py>=4.0.2", "numpy>=2.0.2", "pandas>=2.2.3", "pynauty>=2.8.8.1", "PyYAML>=6.0.2", "scipy>=1.13.1", "pydantic==2.11.7"]



[project.optional-dependencies]
dev = [
    "mkdocs",
    "mkdocs-material",    
    "mdx_include",
    "pymdown-extensions",
    "mkdocstrings[python]",
    "mkdocs-jupyter",
    "asv",
    "asv-runner",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.feature.ira.dependencies]
python = "3.11.*"
pip = "*"
setuptools = "*"
wheel = "*"
cmake = "*"
c-compiler = "*"
cxx-compiler = "*"
fortran-compiler = "*"
make = "*"
numpy = ">=2.0.2"
libblas = "*"
liblapack = "*"
ira = "*"

[tool.pixi.feature.ira.tasks]
install-ira = "python scripts/install_ira.py"
verify-ira = { cmd = 'python -c "import ira_mod, numpy as np; coords=np.array([[0., 0., 0.], [1., 0., 0.], [0., 1., 0.], [0., 0., 1.]], dtype=float); coords2=coords + np.array([0.1, 0.2, 0.3]); rmat, tr, perm, dh = ira_mod.IRA().match(4, [\"X\"] * 4, coords, 4, [\"X\"] * 4, coords2, 2.0); print(\"IRA OK\", float(dh))"', depends-on = ["install-ira"] }

[tool.pixi.feature.pykmc.dependencies]
python = "3.11.*"
pip = "*"
cmake = "*"
fortran-compiler = "*"
make = "*"
ase = ">=3.24.0"
executorlib = "==0.0.8"
lammps = ">=2024.08.29"
mpi4py = ">=4.0.2"
numpy = ">=2.0.2"
pandas = ">=2.2.3"
pynauty = ">=2.8.8.1"
pyyaml = ">=6.0.2"
scipy = ">=1.13.1"
pydantic = "==2.11.7"

[tool.pixi.feature.pykmc.tasks]
install-editable = "python -m pip install --no-build-isolation --no-deps -e ."
install-pypartn = "python scripts/install_pypartn.py --build --require-lammps"
verify-pypartn = { cmd = "python -c \"import pypARTn; base = pypARTn.artn(engine='other'); print('pypARTn base OK', base.version()); base.destroy(); lmp = pypARTn.artn(engine='lmp'); print('pypARTn lmp OK', lmp.version()); lmp.destroy()\"", depends-on = ["install-pypartn"] }

[tool.pixi.feature.test.dependencies]
pytest = "*"
asv = "*"
sympy = "*"

[tool.pixi.feature.test.tasks]
test-amsel-selector = { cmd = "pytest tests/basins/test_amsel_selector.py -q", depends-on = ["install-editable", "install-pypartn", "install-ira"] }
test-basin-mpi = { cmd = "mpirun -np 8 pytest tests/basins/test_basin.py::TestBasin::test_connectivity_table_construction -q", depends-on = ["install-editable", "install-pypartn", "install-ira"] }

[tool.pixi.environments]
ira = { features = ["ira"], solve-group = "ira" }
amsel-test = { features = ["pykmc", "ira", "test"], solve-group = "py311" }


[build-system] 
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project.urls]
Homepage = "https://github.com/hugomoison/pyKMC"
