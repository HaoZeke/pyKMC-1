[project]
name = "pykmc"
version = "0.0.1"
authors = [
  { name="Hugo Moison" },
]
description = "test kmc and python"
readme = "README.md"
requires-python = "<3.13,>=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = ["ase>=3.24.0", "executorlib==0.0.8", "lammps>=2024.8.29", "mpi4py>=4.0.2", "numpy>=2.0.2", "pandas>=2.2.3", "pynauty>=2.8.8.1", "PyYAML>=6.0.2", "scipy>=1.13.1", "pydantic==2.11.7"]



[project.optional-dependencies]
dev = [
    "mkdocs",
    "mkdocs-material",    
    "mdx_include",
    "pymdown-extensions",
    "mkdocstrings[python]",
    "mkdocs-jupyter",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.feature.ira.dependencies]
python = "3.11.*"
ira = ">=2.2.0,<3"

[tool.pixi.feature.ira.tasks]
verify-ira = "python -c \"import ira_mod; print('IRA OK')\""

[tool.pixi.feature.pykmc.dependencies]
python = "3.11.*"
pip = "*"
ase = ">=3.24.0"
executorlib = "==0.0.8"
lammps = ">=2024.08.29"
mpi4py = ">=4.0.2"
numpy = ">=2.0.2"
pandas = ">=2.2.3"
pynauty = ">=2.8.8.1"
pyyaml = ">=6.0.2"
scipy = ">=1.13.1"
pydantic = "==2.11.7"

[tool.pixi.feature.pykmc.tasks]
install-editable = "python -m pip install --no-build-isolation --no-deps -e ."

[tool.pixi.feature.test.dependencies]
pytest = "*"

[tool.pixi.feature.test.tasks]
test-amsel-selector = { cmd = "pytest tests/basins/test_amsel_selector.py -q", depends-on = ["install-editable"] }

[tool.pixi.feature.amsel.pypi-dependencies]
amsel = "*"

[tool.pixi.environments]
ira = { features = ["ira"], solve-group = "ira" }
amsel-test = { features = ["pykmc", "ira", "amsel", "test"], solve-group = "py311" }


[build-system] 
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project.urls]
Homepage = "https://github.com/hugomoison/pyKMC"
